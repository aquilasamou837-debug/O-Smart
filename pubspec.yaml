name: osmart 
description: "Application de contrôle de pompes ESP32"
publish_to: 'none' 
version: 1.0.0+1 

environment: 
  sdk: ^3.11.5 

dependencies: 
  flutter: 
    sdk: flutter 
    
  # UI
  cupertino_icons: ^1.0.8 
  stylish_bottom_bar: ^1.1.1 
  syncfusion_flutter_gauges: ^33.2.4 
  lottie: ^3.3.3 
  flutter_svg: ^2.2.4
  flutter_native_splash: ^2.4.7

  # State Management
  get: ^4.7.3 
  get_x_storage: ^0.1.0 # ← Corrige: c'est get_storage, pas get_x_storage

  # Firebase
  firebase_core: ^4.7.0 
  firebase_auth: ^6.4.0 
  cloud_firestore: ^6.3.0 # ← Manquant: pour tes pompes
  google_sign_in: ^7.2.0 
  
  # Hardware
  mobile_scanner: ^7.2.0 
  permission_handler: ^12.0.1

  # MQTT pour ESP32 - à ajouter
  mqtt_client: ^10.11.11 # ← Pour contrôler les pompes

dev_dependencies: 
  flutter_test: 
    sdk: flutter 
  flutter_lints: ^6.0.0 

flutter: 
  uses-material-design: true 
  assets: 
    - assets/animations/ 
    - assets/logo/ 
    - assets/logo/logo.png 
    - assets/logo/google_icon.svg